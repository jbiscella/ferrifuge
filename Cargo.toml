[package]
name = "ferrifuge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Centrifugo client SDK for Rust"
license = "0BSD"
repository = "https://github.com/jbiscella/ferrifuge"
keywords = ["centrifugo", "centrifuge", "websocket", "realtime", "pubsub"]
categories = ["network-programming", "asynchronous"]

[features]
default = ["tokio", "ring"]
# Runtime adapter. The core must compile without it: `cargo check --no-default-features`.
tokio = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:futures-channel",
    "dep:futures-core",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:reqwest",
]
# TLS crypto provider of the tokio adapter, chosen at build time (Block 6).
# A build without ring disables default features. When several are enabled
# the strongest wins: fips > aws-lc-rs > ring.
ring = ["rustls?/ring"]
aws-lc-rs = ["rustls?/aws-lc-rs"]
# aws-lc-rs in FIPS mode; building it needs CMake and Go.
fips = ["aws-lc-rs", "rustls?/fips"]
# Hooks for the crate's own tests and benchmarks, e.g. Machine::with_seed.
# Not part of the public API: enabled only by the dev-dependency on itself
# below, never by applications.
test-util = []

[dependencies]
fastrand = "2.5.0"
futures-channel = { version = "0.3.34", optional = true }
futures-core = { version = "0.3.34", optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"], optional = true }
prost = "0.14.4"
# http_stream and sse (Block 8). No provider of its own: it is given the
# client's TLS configuration, so the build's provider applies (Block 6).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "logging"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
tokio = { version = "1.54.0", features = ["rt", "sync", "time", "macros"], optional = true }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"], optional = true }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.3.0"

[dev-dependencies]
# The crate itself with its test hooks, for its tests and benchmarks only.
# No default features, so builds without them (the core alone, aws-lc
# providers without ring) stay so.
ferrifuge = { path = ".", default-features = false, features = ["test-util"] }
# Reports the linked AWS-LC module in the fips build's unit test. Its
# backend comes from rustls (fips) or reqwest (other test builds).
aws-lc-rs = { version = "1.18.2", default-features = false }
axum = "0.8.9"
base64 = "0.23.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
cucumber = "0.23"
dhat = "0.3.3"
gungraun = "0.20.0"
hmac = "0.13.0"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
testcontainers = { version = "0.28", features = ["http_wait"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "centrifugo_smoke"
required-features = ["tokio"]

[[test]]
name = "bdd"
harness = false
required-features = ["tokio"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[[bench]]
name = "dispatch"
harness = false

[[test]]
name = "perf_alloc"
harness = false
required-features = ["tokio"]

[[test]]
name = "perf_footprint"
harness = false
required-features = ["tokio"]

# Uses Machine::with_seed. The dev-dependency enabling test-util has no
# version, so a packaged crate drops it; this target then skips.
[[test]]
name = "perf_sim"
required-features = ["test-util"]

[[bench]]
name = "wallclock"
harness = false

[[test]]
name = "perf_wallclock"
harness = false
required-features = ["tokio"]
