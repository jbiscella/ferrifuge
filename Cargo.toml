[package]
name = "ferrifuge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Centrifugo client SDK for Rust"
license = "0BSD"
repository = "https://github.com/jbiscella/ferrifuge"
keywords = ["centrifugo", "centrifuge", "websocket", "realtime", "pubsub"]
categories = ["network-programming", "asynchronous"]

[features]
default = []
# Runtime adapter. The core must compile without it: `cargo check --no-default-features`.
tokio = []

[dependencies]
prost = "0.14.4"

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.3.0"

[dev-dependencies]
cucumber = "0.23"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"
testcontainers = { version = "0.28", features = ["http_wait"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "time"] }

[[test]]
name = "bdd"
harness = false

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
