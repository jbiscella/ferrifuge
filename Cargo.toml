[package]
name = "ferrifuge"
version = "0.21.0"
edition = "2024"
rust-version = "1.88"
description = "Centrifugo client SDK for Rust"
license = "0BSD AND MIT"
repository = "https://github.com/jbiscella/ferrifuge"
keywords = ["centrifugo", "centrifuge", "websocket", "realtime", "pubsub"]
categories = ["network-programming", "asynchronous"]
documentation = "https://docs.rs/ferrifuge"
# What crates.io gets (Block 20, D3): tests, benches, fixtures, workflows
# and the project's notes stay in the repository.
# Anchored with "/": the patterns match at any depth otherwise.
include = [
    "/src/**",
    "/proto/**",
    "/build.rs",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
    # Fuzzing corpora next to the targets, which .gitignore leaves out but
    # `include` would not.
    "!/src/**/__fuzz__/**",
]

# docs.rs builds the default features, test-util, cookies and unstable,
# natively and for the browser target, where cookies builds nothing: never
# fips, whose build needs Go and CMake (Block 20, D7; Block 37, D7; Block
# 43, D8; Block 44, D19; Block 45, D17).
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]
features = ["test-util", "cookies", "unstable"]

[features]
default = ["tokio", "ring", "browser"]
# Runtime adapter. The core must compile without it: `cargo check --no-default-features`.
tokio = [
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:futures-core",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:rustls-platform-verifier",
    "dep:reqwest",
    "dep:tracing",
    "dep:hyper-util",
    "dep:hyper-rustls",
    "dep:tower-service",
    "dep:http",
    "dep:base64",
    "dep:percent-encoding",
    "dep:jni",
    "dep:sse-core",
    "dep:tokio-util",
    "dep:bytes",
    "dep:mediatype",
]
# TLS crypto provider of the tokio adapter, chosen at build time (Block 6).
# A build without ring disables default features. When several are enabled
# the strongest wins: fips > aws-lc-rs > ring.
# Each also forwards to wtransport, when `unstable-webtransport` brings it
# (Block 48, D1, D15).
ring = ["rustls?/ring", "wtransport?/ring"]
aws-lc-rs = ["rustls?/aws-lc-rs", "wtransport?/aws-lc-rs"]
# aws-lc-rs in FIPS mode; building it needs CMake and Go.
fips = ["aws-lc-rs", "rustls?/fips", "wtransport?/fips"]
# An opt-in cookie jar of the tokio adapter (Block 43): CookieJar,
# MemoryJar and ClientBuilder::cookie_jar. Not a default.
cookies = ["tokio", "dep:cookie_store", "dep:url"]
# The browser adapter (Block 44): the same Client on
# wasm32-unknown-unknown, over the browser's WebSocket and fetch. It
# builds nothing on other targets, so it is a default; `tokio`, the
# providers and `cookies` build as nothing on the browser target.
browser = [
    "dep:tokio",
    "dep:futures-util",
    "dep:futures-core",
    "dep:tracing",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:web-sys",
    "dep:gloo-timers",
    "dep:wasm-streams",
    # http_stream's decoders (Block 27), shared with the tokio adapter.
    "dep:tokio-util",
    "dep:bytes",
    "dep:mediatype",
    # The core's random source seeded by the browser (Block 44, D5).
    "fastrand/js",
]
# Constructors of the events and results the client yields, for an
# application's tests (Block 37). Not a default.
test-util = ["tokio?/io-util"]
# Experimental APIs following centrifuge-js 63ed73e and Centrifugo's
# experimental features (Block 45: map subscriptions; Block 47: shared poll
# subscriptions). Not a default, and
# outside the semver promise: what it enables may change in any minor
# release.
unstable = []
# The native WebTransport transport (Block 48, D1): unstable, as its name
# tells cargo-semver-checks, and apart from `unstable` so that the core-only
# `unstable` build and the users of Blocks 45 and 47 get no QUIC stack. In
# the browser `unstable` is enough: the browser's WebTransport needs no crate.
unstable-webtransport = ["unstable", "tokio", "dep:wtransport"]
# Hooks for the crate's own tests and benchmarks, e.g. Machine::with_seed.
# Private (the leading underscores): not part of the public API, enabled
# only by the dev-dependency on itself below, never by applications.
__test-hooks = []

[dependencies]
fastrand = "2.5.0"
futures-core = { version = "0.3.34", optional = true }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"], optional = true }
prost = "0.14.4"
# Maintained decoders of the streams the server sends (Block 27), for both
# adapters: http_stream JSON lines and media types; sse-core is native.
tokio-util = { version = "0.7.20", default-features = false, features = ["codec"], optional = true }
bytes = { version = "1.12.1", optional = true }
mediatype = { version = "0.23.0", optional = true }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
# Both adapters: `sync` and `macros` build for the browser target too
# (Block 44, D1); the native table adds the runtime and the timers.
tokio = { version = "1.54.0", features = ["sync", "macros"], optional = true }
# Logging of the adapters (Block 21): the core logs nothing. `log`
# makes the records reach a `log` logger while no tracing subscriber is set.
tracing = { version = "0.1.44", default-features = false, features = ["std", "log"], optional = true }

# The tokio adapter's own dependencies: native targets only, so that
# `tokio`, the providers and `cookies` build as nothing on the browser
# target (Block 44, D1).
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dependencies]
# http_stream and sse (Block 8). No provider of its own: it is given the
# client's TLS configuration, so the build's provider applies (Block 6).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "socks"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "logging"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
# The operating system's verifier on macOS, iOS and Windows (Block 22); at
# reqwest's version, which links it in every build already.
rustls-platform-verifier = { version = "0.7.1", optional = true }
# Proxies (Block 23): hyper-util's proxy matcher and its CONNECT and SOCKS5
# connectors, hyper-rustls for TLS to an https:// proxy, at reqwest's
# versions; base64 decodes the Basic credentials of an environment's proxy.
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "client-proxy", "client-proxy-system", "tokio"], optional = true }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "tls12"], optional = true }
tower-service = { version = "0.3.3", optional = true }
http = { version = "1.5.0", optional = true }
base64 = { version = "0.23.1", optional = true }
percent-encoding = { version = "2.3.2", optional = true }
# Maintained decoders of the streams the server sends (Block 27): sse
# events, http_stream JSON lines, and media types.
sse-core = { version = "0.2.3", default-features = false, features = ["std"], optional = true }
# The cookie jar (Block 43, D1): no default feature, so no public-suffix
# list and no serde; url at reqwest's version, the type cookie_store and
# CookieJar take.
cookie_store = { version = "0.22.1", default-features = false, optional = true }
url = { version = "2.5.8", optional = true }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"], optional = true }
# WebTransport (Block 48, D3): HTTP/3 and QUIC through wtransport, with no
# provider and no root store of its own: the client's TLS settings and the
# build's provider apply (D4, D15). quinn is reached through it.
wtransport = { version = "0.7.2", default-features = false, features = ["quinn"], optional = true }
# `rt-multi-thread` for `block_in_place` around a handler call (Block 41b):
# a handler that blocks must not hold the tasks its worker woke.
tokio = { version = "1.54.0", features = ["rt", "rt-multi-thread", "time"], optional = true }

# The browser adapter's dependencies (Block 44, D1, D4, D6): the browser
# target only.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
wasm-bindgen = { version = "0.2.130", optional = true }
wasm-bindgen-futures = { version = "0.4.80", optional = true }
js-sys = { version = "0.3.107", optional = true }
web-sys = { version = "0.3.107", optional = true, features = [
    "AbortController",
    "AbortSignal",
    "BinaryType",
    "CloseEvent",
    "Event",
    "EventSource",
    "EventSourceInit",
    "EventTarget",
    "MessageEvent",
    "Headers",
    "Performance",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Response",
    "ResponseType",
    "Url",
    "UrlSearchParams",
    "WebSocket",
] }
gloo-timers = { version = "0.4.0", features = ["futures"], optional = true }
# Reads a fetch response's body only when polled (Block 44, D7, D8).
wasm-streams = { version = "0.7.1", optional = true }

# Android only (Block 24): the JNI types of ferrifuge::android, at the
# version rustls-platform-verifier uses there.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false, optional = true }

[build-dependencies]
prost-build = "0.14.4"
protoc-bin-vendored = "3.3.0"

[dev-dependencies]
# The crate itself with its test hooks, for its tests and benchmarks only.
# No default features, so builds without them (the core alone, aws-lc
# providers without ring) stay so.
ferrifuge = { path = ".", default-features = false, features = ["__test-hooks", "test-util"] }

# Native tests only: mio, which they pull in, does not build for wasm32
# (Block 40, D3; Block 44, D18).
[target.'cfg(not(all(target_arch = "wasm32", target_os = "unknown")))'.dev-dependencies]
# Reports the linked AWS-LC module in the fips build's unit test. Its
# backend comes from rustls (fips) or reqwest (other test builds).
aws-lc-rs = { version = "1.18.2", default-features = false }
axum = "0.8.9"
base64 = "0.23.1"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
cucumber = "0.23"
dhat = "0.3.3"
gungraun = "0.20.0"
hmac = "0.13.0"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
testcontainers = { version = "0.28", features = ["http_wait"] }
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "time", "process", "io-util", "test-util"] }
bolero = "0.13.7"
# Short validity of the test certificates, as Apple's verifier wants
# (Block 22).
time = { version = "0.3.47", default-features = false, features = ["std"] }
# The TLS listener of the https:// test proxy (Block 23).
tokio-rustls = { version = "0.26.6", default-features = false }
# Awaits a ready() future outside any runtime (Block 30, D5); already in
# the lock file, from the project of futures-core and futures-util.
futures-executor = { version = "0.3.34", default-features = false, features = ["std"] }
# The log capture of the Block 21 scenarios and of tests/log_facade.rs.
log = { version = "0.4.35", features = ["std"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

# The @W tests in a browser (Block 44, D18).
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test = "0.3.80"

[[test]]
name = "centrifugo_smoke"
required-features = ["tokio"]

[[test]]
name = "adapter_tokens"
required-features = ["tokio"]

[[test]]
name = "debounce_driver"
required-features = ["tokio"]

[[test]]
name = "log_facade"
required-features = ["tokio"]

[[test]]
name = "handler_logs"
required-features = ["tokio"]

[[test]]
name = "proxy_env"
harness = false
required-features = ["tokio"]

[[test]]
name = "bdd"
harness = false
required-features = ["tokio"]

# Runs tests/browser_wasm.rs in browsers against Centrifugo (Block 44, D18).
[[test]]
name = "browser"
harness = false
required-features = ["tokio"]

# The @W tests, built for wasm32-unknown-unknown only (Block 44, D18).
[[test]]
name = "browser_wasm"
required-features = ["browser"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[[bench]]
name = "dispatch"
harness = false

[[test]]
name = "perf_alloc"
harness = false
required-features = ["tokio"]

[[test]]
name = "perf_footprint"
harness = false
required-features = ["tokio"]

# The oversized-delta bound of Block 19, measured with dhat on the core.
[[test]]
name = "perf_delta"
harness = false

# Uses Machine::with_seed. The dev-dependency enabling __test-hooks has no
# version, so a packaged crate drops it; this target then skips.
[[test]]
name = "perf_sim"
required-features = ["__test-hooks"]

# Seeded chaos on the sans-IO core (Block 16); uses Machine::with_seed.
[[test]]
name = "chaos"
required-features = ["__test-hooks"]

# Seeded chaos on the tokio client against the fake server (Block 16).
[[test]]
name = "chaos_adapter"
required-features = ["tokio"]

[[bench]]
name = "wallclock"
harness = false

[[test]]
name = "perf_wallclock"
harness = false
required-features = ["tokio"]

# Build profile of coverage-guided fuzzing with cargo-bolero (Block 14e).
[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
codegen-units = 1

[[test]]
name = "interop"
harness = false
required-features = ["tokio"]

# Examples need a server; they build with the tokio adapter (Block 20, D8).
[[example]]
name = "quickstart"
required-features = ["tokio"]

[[example]]
name = "recovery"
required-features = ["tokio"]

[[example]]
name = "calls"
required-features = ["tokio"]

[[example]]
name = "delta"
required-features = ["tokio"]
