# cargo-deny: dependency security and supply-chain policy.
# Run locally with `cargo deny check`; CI runs the same command.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Dev-dependencies are checked too: they run in CI with network and Docker access.
all-features = true
# The platforms ferrifuge supports (CLAUDE.md, Block 8), and the browser
# target of its browser adapter (Block 44, D19).
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

[advisories]
# RustSec advisory DB: vulnerabilities, unmaintained, unsound and yanked crates.
# Every entry in `ignore` needs a reason and an issue link.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    # Dev-only, through testcontainers 0.28.0 (the latest), which the test
    # suite uses to start Centrifugo; nothing ferrifuge ships depends on it.
    # Unmaintained, no known vulnerability. Remove once a testcontainers
    # release drops it: https://github.com/testcontainers/testcontainers-rs/pull/1006
    { id = "RUSTSEC-2026-0440", reason = "dev-only via testcontainers; upstream fix in testcontainers-rs#1006" },
]

[licenses]
# Permissive licenses only: anything ferrifuge ships must stay usable under 0BSD terms.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    # aws-lc-fips-sys (fips feature; the locked aws-lc-sys no longer names it):
    # owner decision to allow it globally rather than per crate (CLAUDE.md,
    # Block 0). Its acknowledgement clauses are noted in the README.
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = [
    # Built for no target: rustls-platform-verifier depends on it on wasm32
    # only, and ferrifuge depends on rustls-platform-verifier on its native
    # targets only (Block 44, D1); `cargo tree -i webpki-root-certs` finds
    # it for none of the targets above. cargo-deny takes the union of the
    # targets' edges, so wasm32-unknown-unknown in the list reaches it.
    { crate = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
