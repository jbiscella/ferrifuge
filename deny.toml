# cargo-deny: dependency security and supply-chain policy.
# Run locally with `cargo deny check`; CI runs the same command.
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
# Dev-dependencies are checked too: they run in CI with network and Docker access.
all-features = true
# The platforms ferrifuge supports (CLAUDE.md, Block 8): crates used only
# on others, e.g. wasm32 shims of the HTTP client, are not shipped.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]

[advisories]
# RustSec advisory DB: vulnerabilities, unmaintained, unsound and yanked crates.
# Every entry in `ignore` needs a reason and an issue link.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only: anything ferrifuge ships must stay usable under 0BSD terms.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    # aws-lc-sys and aws-lc-fips-sys (aws-lc-rs and fips features): owner
    # decision to allow it globally rather than per crate (CLAUDE.md, Block 0).
    # Its advertising clause is noted in the README.
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
