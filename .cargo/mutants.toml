# cargo-mutants (Block 60, D5): the CI `mutants` job mutates a pull
# request's changes, and `mutants.yml` mutates the whole scope weekly.

# The library's unit tests kill the mutants: the adapter, left out below,
# is covered by the @D and @A layers instead.
additional_cargo_test_args = ["--lib"]

# The `test` job's features, which compile every `Input` and `Action`
# variant.
features = ["cookies", "unstable", "unstable-webtransport"]

exclude_globs = [
    # The runtime adapters: covered by the @D and @A layers, not by the
    # library's unit tests.
    "src/adapter/**",
    # The test doubles the crate ships for applications' tests.
    "src/test_util/**",
    # Generated by prost-build, checked by tests/protocol_codegen.rs.
    "src/protocol/**",
    "src/protocol.rs",
    # Test files, whose `cfg(all(test, …))` cargo-mutants does not take
    # for test code.
    "**/*_tests.rs",
    "**/tests.rs",
    "**/tests/**",
]

exclude_re = [
    # `__test-hooks` code: test support compiled only for the crate's own
    # tests, not part of the library. A mutant names its function after
    # "replace" (the function's body replaced) or "in" (an operator in it).
    # The sans-IO core's entries match any file, so that renaming the
    # core's files needs no change here.
    'src/fossil\.rs:.* (replace|in) (write|len|number)\b',
    '^src/[^:]+:.* (replace|in) Machine::(with_seed|set_last_command_id|call_registries|codec_protocol|running_settings|timer_setting|subscription_timer_setting|call_timer_setting)\b',
    '^src/[^:]+:.* (replace|in) Calls::registries\b',
]
