version: 2

# Weekly, grouped update PRs so dependency drift stays small. Each PR goes
# through the ci and dependencies workflows like any other change.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "[deps]"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Pinned to a commit of its master branch, the toolchain named by its
      # `toolchain` input (Block 57, D2): it has no releases to follow, so
      # the pin is bumped by hand.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "[deps]"
