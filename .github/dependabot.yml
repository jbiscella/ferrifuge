version: 2

# Weekly, grouped update PRs so dependency drift stays small. Each PR goes
# through the ci and dependencies workflows like any other change.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: "[deps]"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "[deps]"

  # The gitleaks hook (Block 70 D8). Its pull request fails the `secrets`
  # job's version check until the job's version, asset digest and commit
  # are bumped with it, by hand.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "[deps]"
