# Real-server chaos (Block 51): seeded faults against a real Centrifugo
# through Toxiproxy, checked against the server's own records. Needs
# Docker: Linux only (D11). Never on pull requests.
#
# One row so far (websocket, JSON, memory engine) with D3's toxics, the
# proxy turned down, and D4's server pause and restart, client suspension
# and short-lived tokens, after D6's two restart scenarios; the other rows
# come with 51d. Nightly, off
# the hour (GitHub may delay or drop runs on the hour), and dispatched; a
# scheduled run is skipped only when main's head already has a real run
# (D11, scripts/validation-run).
name: chaos-real

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  # TEMPORARY, removed before merge: the evidence run of the PR's branch
  # (workflow_dispatch fires only for a file on the default branch).
  push:
    branches: [impl/block-51c-real-faults]

permissions:
  contents: read

jobs:
  # On schedule, whether main's head still lacks a real run; dispatched,
  # always (D11).
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = schedule ]; then
            scripts/validation-run should-run chaos-real.yml "$GITHUB_SHA"
          else
            echo "run=true: dispatched"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  chaos:
    needs: guard
    if: ${{ needs.guard.outputs.run == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - transport: websocket
            protocol: json
            engine: memory
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FERRIFUGE_REAL_CHAOS: "1"
      FERRIFUGE_REAL_CHAOS_BUDGET_SECONDS: "1800"
      FERRIFUGE_REAL_CHAOS_ARTIFACTS: ${{ github.workspace }}/chaos-real-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Images
        run: |
          docker pull "centrifugo/centrifugo:$(sed -n 's/^pub(crate) const TAG: &str = "\(.*\)";/\1/p' tests/support/centrifugo.rs)"
          docker pull "$(sed -n 's/^pub(crate) const TOXIPROXY_IMAGE: &str = "\(.*\)";/\1/p' tests/support/real_server.rs)"

      - name: Real-server chaos, ${{ matrix.transport }} ${{ matrix.protocol }} ${{ matrix.engine }}
        run: |
          set -o pipefail
          cargo test --features tokio --test chaos_real | tee chaos-real.txt
          { echo '### Real-server chaos'; grep '^@P report' chaos-real.txt; } >> "$GITHUB_STEP_SUMMARY"

      # The child and container output of a failing seed (structural
      # acceptance).
      - name: Failing seeds
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chaos-real-${{ matrix.transport }}-${{ matrix.protocol }}-${{ matrix.engine }}
          path: |
            chaos-real-artifacts
            chaos-real.txt
          if-no-files-found: ignore

  # Fails unless every matrix job succeeded (D11): a job stopped by its
  # timeout, cancelled or skipped is not a success. Skipped with the run
  # when the guard skips it: a skip is never evidence.
  verdict:
    needs: [guard, chaos]
    if: ${{ !cancelled() && needs.guard.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Every row passed
        run: test "${{ needs.chaos.result }}" = "success"
