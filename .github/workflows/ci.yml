name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The jobs pull requests skip (chaos, chaos-adapter, perf, wall-clock,
  # fuzz) also run nightly.
  schedule:
    - cron: "23 2 * * *"
  # Runs every job on any branch, on demand.
  workflow_dispatch:

permissions:
  contents: read

# One run per branch. A new push to a pull request cancels its running CI;
# runs on main are never cancelled, so quick merges do not cut its heavy
# jobs short. Nightly runs have their own group, apart from merges.
concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Line-coverage floor for the library, mirrors the 70% instruction floor
  # used in the JVM projects. Branch coverage needs nightly, so lines only.
  COVERAGE_FLOOR: 70

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --check

      # Every file carries license and copyright information (REUSE.toml;
      # LICENSE lists the exceptions to 0BSD). The runner image ships pipx;
      # reuse is pinned to an exact version.
      - name: reuse lint
        run: pipx run reuse==5.0.2 lint

      # Lint levels live in Cargo.toml [lints]; CI only promotes warnings to errors.
      - name: clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      # With the opt-in cookie jar and the unstable APIs (Block 43, D8;
      # Block 45, D16).
      - name: clippy (cookies, unstable)
        run: cargo clippy --all-targets --features cookies,unstable -- -D warnings

      # With the native WebTransport transport (Block 48, D1, D4): the root
      # clippy.toml refuses wtransport's own TLS and certificate helpers.
      - name: clippy (cookies, unstable-webtransport)
        run: cargo clippy --all-targets --features cookies,unstable-webtransport -- -D warnings

      # The core must not depend on an async runtime.
      - name: clippy (no default features)
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: rustdoc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      # The default build uses ring and must not link aws-lc (Block 6).
      - name: default build links only ring
        run: |
          test -z "$(cargo tree -e normal -i aws-lc-rs 2>/dev/null)"
          test -z "$(cargo tree -e normal --features unstable-webtransport -i aws-lc-rs 2>/dev/null)"

      # wtransport, quinn, sha2 and x509-parser come with
      # `unstable-webtransport` only, sha2 and x509-parser through
      # wtransport alone (Block 48, structural acceptance).
      - name: WebTransport's crates come with its feature only
        run: |
          for features in "" "--features unstable"; do
            for crate in wtransport quinn sha2 x509-parser; do
              test -z "$(cargo tree -e normal $features -i $crate 2>/dev/null)"
            done
          done
          for crate in sha2 x509-parser; do
            test "$(cargo tree -e normal --features unstable-webtransport -i $crate --depth 1 --prefix none 2>/dev/null | tail -n +2 | sed 's/ (\*)//' | sort -u | cut -d' ' -f1)" = wtransport
          done

      # A release build calls none of sha2 and x509-parser, which wtransport
      # links unconditionally (Block 48, D3).
      - name: no sha2 or x509-parser symbol in a WebTransport build
        run: |
          cargo build --release --example webtransport --features unstable-webtransport
          nm -C target/release/examples/webtransport > webtransport-symbols.txt
          grep -q "wtransport::" webtransport-symbols.txt
          ! grep -E "sha2::|x509_parser::" webtransport-symbols.txt

  # Builds with an aws-lc TLS provider (Block 6). The default ring build is
  # tested by the test job.
  providers:
    runs-on: ubuntu-latest
    # Building aws-lc in FIPS mode takes several minutes; a hung test fails
    # the job instead of running for GitHub's 6 hours.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [aws-lc-rs, fips]
    env:
      # With the WebTransport transport, whose QUIC stack uses the same
      # provider (Block 48, D15).
      WITHOUT_RING: --no-default-features --features tokio,${{ matrix.provider }},unstable-webtransport
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.provider }}

      # aws-lc builds with a C compiler; its FIPS module also needs CMake and
      # Go. Installed explicitly rather than relying on the runner image.
      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Pull Centrifugo image
        run: docker pull centrifugo/centrifugo:v6.10.1

      - name: ring is not linked
        run: test -z "$(cargo tree -e normal $WITHOUT_RING -i ring 2>/dev/null)"

      - name: clippy
        run: cargo clippy --all-targets $WITHOUT_RING -- -D warnings

      # Every scenario, the encrypted one included, with this provider.
      - name: cargo test
        run: cargo test --all-targets $WITHOUT_RING

      # Default features keep ring enabled: the stronger provider must win.
      - name: precedence over the default ring
        run: cargo test --lib --features ${{ matrix.provider }},unstable-webtransport -- tls_config fips_build webtransport

  test:
    runs-on: ubuntu-latest
    # A hung test fails the job instead of running for GitHub's 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Pulled up front so container start-up does not count against test timeouts.
      - name: Pull Centrifugo image
        run: docker pull centrifugo/centrifugo:v6.10.1

      # One instrumented run executes every test target, including the
      # cucumber runner, so tests are not run twice for coverage.
      - name: cargo test (with coverage)
        # With the opt-in cookie jar and the unstable APIs, WebTransport's
        # included, so that their code is tested too (Block 43, D8; Block 45,
        # D16; Block 48, D15).
        run: cargo llvm-cov --all-targets --features cookies,unstable,unstable-webtransport --lcov --output-path lcov.info

      # --all-targets does not include doctests.
      - name: doctests
        run: cargo test --doc

      # The sans-IO core alone, without the tokio adapter (review item D6).
      - name: cargo test (no default features)
        run: cargo test --no-default-features --lib

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Coverage'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn

      # Skipped while the library has no measurable lines (generated code
      # aside), since a floor on zero lines always fails.
      - name: Coverage floor
        run: |
          lines=$(cargo llvm-cov report --json --summary-only | jq '.data[0].totals.lines.count')
          if [ "$lines" -eq 0 ]; then
            echo "No library lines to measure yet; floor not enforced."
            exit 0
          fi
          cargo llvm-cov report --summary-only --fail-under-lines "$COVERAGE_FLOOR"

  # Seeded chaos on the sans-IO core (Block 16): 10 000 seeds of 200
  # operations in release, from a start seed drawn per run and printed,
  # then the same with delta subscriptions (Block 19), with automatic
  # batching on even seeds (Block 36), and with debounced publishes (Block
  # 46); a failure prints the command that reruns its seed alone. Pull requests
  # run seeds 0-299 in the test and portability jobs.
  chaos:
    # Heavy: on main (merges and nightly) and on demand, not on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Long chaos run
        run: |
          set -o pipefail
          cargo test --release --test chaos seeded_chaos_long_run -- --ignored --nocapture 2>&1 | tee chaos.txt
          # And with delta subscriptions, some deltas broken (Block 19).
          FERRIFUGE_CHAOS_SUBSCRIPTIONS=3 cargo test --release --test chaos seeded_chaos_long_run -- --ignored --nocapture 2>&1 | tee -a chaos.txt
          # And with automatic batching on even seeds (Block 36, D9).
          FERRIFUGE_CHAOS_SUBSCRIPTIONS=4 cargo test --release --test chaos seeded_chaos_long_run -- --ignored --nocapture 2>&1 | tee -a chaos.txt
          # And with debounced publishes, windows meeting reconnects and batches (Block 46, D16).
          FERRIFUGE_CHAOS_SUBSCRIPTIONS=5 cargo test --release --test chaos seeded_chaos_long_run -- --ignored --nocapture 2>&1 | tee -a chaos.txt

      # The drawn start seed, and the failing seed, also when the run fails.
      - name: Chaos summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Seeded chaos'
            echo '```'
            grep -Eo 'chaos: seeds .*|seed [0-9]+ broke .*|rerun: .*' chaos.txt || echo 'no seed printed'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Seeded chaos on the tokio client against the fake server (Block 16), in
  # real time: 500 seeds, then 100 with delta subscriptions (Block 19) and
  # 100 with debounced publishes (Block 46), from a start seed drawn per run
  # on Linux, and the
  # pull-request seeds 0-19 on Windows and macOS, where real-time limits
  # would make pull requests flaky. Pull requests run seeds 0-19 on Linux in
  # the test job.
  chaos-adapter:
    # Heavy: on main (merges and nightly) and on demand, not on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Adapter chaos run
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            cargo test --test chaos_adapter seeded_chaos_adapter_long_run -- --ignored --nocapture 2>&1 | tee chaos.txt
            FERRIFUGE_CHAOS_DELTA=1 FERRIFUGE_CHAOS_SEEDS=100 cargo test --test chaos_adapter seeded_chaos_adapter_long_run -- --ignored --nocapture 2>&1 | tee -a chaos.txt
            FERRIFUGE_CHAOS_DEBOUNCE=1 FERRIFUGE_CHAOS_SEEDS=100 cargo test --test chaos_adapter seeded_chaos_adapter_long_run -- --ignored --nocapture 2>&1 | tee -a chaos.txt
          else
            cargo test --test chaos_adapter 2>&1 | tee chaos.txt
          fi

      # The drawn start seed, and the failing seed, also when the run fails.
      - name: Chaos summary
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo "### Adapter chaos (${{ matrix.os }})"
            echo '```'
            grep -Eo 'chaos: adapter seeds .*|seed [0-9]+ broke .*|replay: .*' chaos.txt || echo 'no seed printed'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Deterministic @P metrics of Block 14: instruction counts, with gungraun
  # on Valgrind.
  perf:
    # Heavy: on main (merges and nightly) and on demand, not on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind

      # The runner must match the gungraun library version in Cargo.lock.
      - name: gungraun version
        id: gungraun
        run: echo "version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "gungraun") | .version')" >> "$GITHUB_OUTPUT"

      # A prebuilt binary rather than compiling it (about 2 min).
      - name: Install gungraun-runner
        uses: taiki-e/install-action@v2
        with:
          tool: gungraun-runner@${{ steps.gungraun.outputs.version }}

      - name: Benchmarks
        run: cargo bench --bench dispatch -- --save-summary=json

      # Release, as the benchmark: the debug build would compile every
      # dependency again (about 2 min).
      - name: Gates on the benchmark counts
        run: cargo test --release --test perf_gates -- --ignored

      # Gates, and reports the measured values in the job summary.
      - name: Allocations per publication
        run: |
          set -o pipefail
          FERRIFUGE_PERF=1 cargo test --release --test perf_alloc | tee perf_alloc.txt
          { echo '### Allocations per publication'; grep '^@P report' perf_alloc.txt; } >> "$GITHUB_STEP_SUMMARY"

      - name: Memory footprint
        run: |
          set -o pipefail
          FERRIFUGE_PERF=1 cargo test --release --test perf_footprint | tee perf_footprint.txt
          { echo '### Memory footprint'; grep '^@P report' perf_footprint.txt; } >> "$GITHUB_STEP_SUMMARY"

      # Shared poll subscriptions within the same limit (Block 47, D3).
      - name: Memory footprint with unstable
        run: |
          set -o pipefail
          FERRIFUGE_PERF=1 cargo test --release --features unstable --test perf_footprint | tee perf_footprint_unstable.txt
          { echo '### Memory footprint (unstable)'; grep '^@P report' perf_footprint_unstable.txt; } >> "$GITHUB_STEP_SUMMARY"

  # Wall-clock figures of Block 14 (@P): measured and reported, never
  # gating, since they depend on the runner.
  wall-clock:
    # Heavy: on main (merges and nightly) and on demand, not on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Decode and dispatch time
        run: |
          set -o pipefail
          cargo bench --bench wallclock | tee wallclock.txt
          { echo '### Decode and dispatch time'; echo '```'; grep -A1 '^decode and dispatch' wallclock.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Two minutes of the run are the idle period.
      - name: Delivery latency and idle CPU
        run: |
          set -o pipefail
          FERRIFUGE_PERF=1 cargo test --release --test perf_wallclock | tee perf_wallclock.txt
          { echo '### Delivery latency and idle CPU'; grep '^@P report' perf_wallclock.txt; } >> "$GITHUB_STEP_SUMMARY"

  # The unit, @E and @D layers on Windows and macOS (Block 14e). @A and @B
  # need Docker, so they run on Linux only.
  portability:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Unit tests
        run: cargo test --lib

      - name: Scenarios without a server
        run: cargo test --features cookies,unstable --test bdd -- --tags "not @A and not @B and not @P"

      - name: Spec sync and simulations
        run: cargo test --test spec_sync --test perf_sim --test chaos

      # Examples build on every OS (Block 20, D8).
      - name: Examples
        run: cargo build --examples

  # The sans-IO core and the browser adapter build for wasm32-unknown-unknown
  # (Block 40, D1, D2; Block 44, D19): their clippy also refuses the std
  # clock and thread calls that panic there. A module linking them imports
  # nothing with the core alone, and only wasm-bindgen's glue with the
  # browser adapter. The tests run in the browser jobs.
  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLIPPY_CONF_DIR: ci/wasm-clippy
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: The core alone
        run: |
          cargo clippy --lib --target wasm32-unknown-unknown --no-default-features -- -D warnings
          cargo build --lib --target wasm32-unknown-unknown --no-default-features

      - name: The core with test-util
        run: |
          cargo clippy --lib --target wasm32-unknown-unknown --no-default-features --features test-util -- -D warnings
          cargo build --lib --target wasm32-unknown-unknown --no-default-features --features test-util

      - name: The browser adapter
        run: |
          cargo clippy --lib --test browser_wasm --target wasm32-unknown-unknown --no-default-features --features browser -- -D warnings
          cargo build --lib --target wasm32-unknown-unknown --no-default-features --features browser

      - name: The browser adapter with test-util
        run: |
          cargo clippy --lib --target wasm32-unknown-unknown --no-default-features --features browser,test-util -- -D warnings
          cargo build --lib --target wasm32-unknown-unknown --no-default-features --features browser,test-util

      # The unstable APIs work in the browser too (Block 45, D14).
      - name: The browser adapter with unstable
        run: |
          cargo clippy --lib --test browser_wasm --target wasm32-unknown-unknown --no-default-features --features browser,unstable -- -D warnings
          cargo build --lib --target wasm32-unknown-unknown --no-default-features --features browser,unstable

      # The default features build there too (Block 44, D1).
      - name: The default features
        run: cargo build --lib --target wasm32-unknown-unknown

      - name: Imports of a module linking the core
        working-directory: ci/wasm-imports
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown
          node check.mjs target/wasm32-unknown-unknown/release/wasm_imports.wasm none

      - name: Imports of a module linking the browser adapter
        working-directory: ci/wasm-imports
        run: |
          cargo build --locked --release --target wasm32-unknown-unknown --features browser
          node check.mjs target/wasm32-unknown-unknown/release/wasm_imports.wasm bindgen

      # wasm-bindgen-cli must match the locked wasm-bindgen exactly.
      - name: wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked --version "${{ steps.wasm-bindgen.outputs.version }}"

      # Reported, no gate (Block 44, D19).
      - name: Size of the browser module
        working-directory: ci/wasm-imports
        run: |
          wasm-bindgen --target web --out-dir bindgen target/wasm32-unknown-unknown/release/wasm_imports.wasm
          size=$(wc -c < bindgen/wasm_imports_bg.wasm)
          gzipped=$(gzip -9 -c bindgen/wasm_imports_bg.wasm | wc -c)
          echo "### Browser module: $size bytes, $gzipped gzipped" >> "$GITHUB_STEP_SUMMARY"

  # The @W tests (Block 44, D18): the browser client against Centrifugo and
  # the relay, in headless Chrome and Firefox, with the drivers the
  # ubuntu-latest image installs (CHROMEWEBDRIVER, GECKOWEBDRIVER).
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked --version "${{ steps.wasm-bindgen.outputs.version }}"

      - name: Pull Centrifugo image
        run: docker pull centrifugo/centrifugo:v6.10.1

      - name: The @W tests in Chrome and Firefox
        run: timeout -k 10 2400 cargo test --test browser
        env:
          FERRIFUGE_BROWSERS: chrome,firefox

  # The @W tests in Safari (Block 44, D19): on main and nightly, not on pull
  # requests, and not a required check. Hosted macOS has no Docker, so the
  # Centrifugo release binary runs, its checksum pinned. Safari has no
  # headless mode: it runs windowed in the runner's session.
  browser-safari:
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CENTRIFUGO_ASSET: centrifugo_6.10.1_darwin_arm64.tar.gz
      CENTRIFUGO_SHA256: fb854f08c163b2063a64e9f455ea5baa9fbc3db29452cbc1fb5c17d46d0e1ec1
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: wasm-bindgen version
        id: wasm-bindgen
        run: echo "version=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')" >> "$GITHUB_OUTPUT"

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --locked --version "${{ steps.wasm-bindgen.outputs.version }}"

      - name: Centrifugo
        run: |
          curl -sSfL -o "$RUNNER_TEMP/$CENTRIFUGO_ASSET" \
            "https://github.com/centrifugal/centrifugo/releases/download/v6.10.1/$CENTRIFUGO_ASSET"
          echo "$CENTRIFUGO_SHA256  $RUNNER_TEMP/$CENTRIFUGO_ASSET" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/$CENTRIFUGO_ASSET" -C "$RUNNER_TEMP" centrifugo
          echo "FERRIFUGE_CENTRIFUGO=$RUNNER_TEMP/centrifugo" >> "$GITHUB_ENV"

      - name: Enable safaridriver
        run: sudo safaridriver --enable

      # macOS has no GNU timeout: the job's timeout-minutes and the
      # harness's own run limit bound the run instead.
      - name: The @W tests in Safari
        run: cargo test --test browser
        env:
          FERRIFUGE_BROWSERS: safari
          SAFARIDRIVER: /usr/bin/safaridriver

  # Mobile builds (Block 24, D1): the library and its unit tests build for
  # Android and iOS, with ring and with aws-lc-rs; nothing runs on a device.
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The compiler, archiver and linker of the runner's NDK
      # (ANDROID_NDK_HOME), at API level 22, the floor of the verifier's
      # Kotlin component; as rustls-platform-verifier's own CI does.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      # With WebTransport (Block 48, D16).
      - name: Default features (ring)
        run: |
          cargo ndk --target arm64-v8a --platform 22 clippy --lib --tests --features unstable-webtransport -- -D warnings
          cargo ndk --target arm64-v8a --platform 22 test --lib --no-run --features unstable-webtransport

      - name: aws-lc-rs
        run: |
          cargo ndk --target arm64-v8a --platform 22 clippy --lib --tests --no-default-features --features tokio,aws-lc-rs,unstable-webtransport -- -D warnings
          cargo ndk --target arm64-v8a --platform 22 test --lib --no-run --no-default-features --features tokio,aws-lc-rs,unstable-webtransport

      # ferrifuge::android is documented for Android only: the host's
      # rustdoc never sees it (Block 24, D6).
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo ndk --target arm64-v8a --platform 22 doc --no-deps

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    # One deployment target for rustc and the C builds (cc reads it too):
    # without it aws-lc's C objects target the SDK's newest iOS while rustc
    # links for 10.0, and ___chkstk_darwin, from iOS 13, goes missing.
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # With WebTransport (Block 48, D16).
      - name: Default features (ring)
        run: |
          cargo clippy --target aarch64-apple-ios --lib --tests --features unstable-webtransport -- -D warnings
          cargo test --target aarch64-apple-ios --lib --no-run --features unstable-webtransport

      - name: aws-lc-rs
        run: |
          cargo clippy --target aarch64-apple-ios --lib --tests --no-default-features --features tokio,aws-lc-rs,unstable-webtransport -- -D warnings
          cargo test --target aarch64-apple-ios --lib --no-run --no-default-features --features tokio,aws-lc-rs,unstable-webtransport

  # The public API against the base branch (Block 14e): a breaking change
  # needs a version bump (0.x: the minor version).
  semver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      # Default features and test-util: the public API. The private
      # __test-hooks are not part of it (Block 37, D7).
      - name: cargo semver-checks
        run: cargo semver-checks --default-features --features test-util,cookies --baseline-rev "${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}"

      # The browser target's API too (Block 44, D19), once the base has the
      # browser adapter: before it, the base does not build there.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # cargo-semver-checks cannot build the rustdoc itself for this target:
      # cargo asks rustc about every crate type of its scratch crate, and
      # wasm32-unknown-unknown has no dylib. Each revision's rustdoc JSON is
      # built with cargo rustdoc instead, as cargo-semver-checks builds it,
      # and the two are compared.
      - name: cargo semver-checks (browser target)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: |
          if ! git show "$BASE:Cargo.toml" | grep -q '^browser = '; then
            echo "the base has no browser adapter: nothing to compare on the browser target"
            exit 0
          fi
          rustdoc_json() {
            RUSTC_BOOTSTRAP=1 cargo rustdoc --lib --target wasm32-unknown-unknown \
              --features test-util,cookies --target-dir "$1" \
              -- -Zunstable-options --output-format json
          }
          rustdoc_json "$RUNNER_TEMP/current"
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          (cd "$RUNNER_TEMP/base" && rustdoc_json "$RUNNER_TEMP/baseline")
          cargo semver-checks \
            --current-rustdoc "$RUNNER_TEMP/current/wasm32-unknown-unknown/doc/ferrifuge.json" \
            --baseline-rustdoc "$RUNNER_TEMP/baseline/wasm32-unknown-unknown/doc/ferrifuge.json"

  # Coverage-guided fuzzing of the decoders with cargo-bolero (Block 14e):
  # 30 s per target on every change, longer in the nightly fuzz workflow.
  fuzz:
    # Heavy: on main (merges and nightly) and on demand, not on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-bolero
        run: cargo install cargo-bolero --locked --version 0.13.5

      - name: Fuzz each decoder
        run: |
          for target in json::tests::fuzz_decode protobuf::tests::fuzz_decode \
              adapter::tokio::http::tests::fuzz_http_stream_decoder adapter::tokio::http::tests::fuzz_sse_decoder adapter::tokio::http::tests::fuzz_protobuf_stream_decoder \
              fossil::tests::fuzz_apply fossil::tests::fuzz_written_delta_round_trip; do
            cargo bolero test --toolchain nightly "$target" -T 30s
          done

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: src/**/__fuzz__/**/crashes
          if-no-files-found: ignore

  # centrifuge-js publishes and Ferrifuge receives, over JSON and Protobuf
  # (Block 14e); the other direction needs Ferrifuge's publish (Block 13).
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Pull Centrifugo image
        run: docker pull centrifugo/centrifugo:v6.10.1

      # centrifuge-js, pinned with its integrity hash in package-lock.json.
      - name: Install centrifuge-js
        run: npm ci --prefix tests/interop --ignore-scripts

      - name: Interop test
        run: FERRIFUGE_INTEROP=1 cargo test --test interop

  msrv:
    runs-on: ubuntu-latest
    # The FIPS build takes several minutes, as in the providers job.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2

      - name: cargo check on MSRV
        run: cargo check --all-targets

      # The sans-IO core alone (review item D6).
      - name: cargo check on MSRV (no default features)
        run: cargo check --all-targets --no-default-features

      # wtransport's rust-version is Ferrifuge's (Block 48, D3).
      - name: cargo check on MSRV (unstable-webtransport)
        run: cargo check --all-targets --features unstable-webtransport

      # The aws-lc builds too (Block 20, D6): their build scripts run under
      # cargo check, so CMake and Go are installed as for the providers job.
      - name: Install CMake
        run: sudo apt-get update && sudo apt-get install -y cmake

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: cargo check on MSRV (aws-lc-rs)
        run: cargo check --all-targets --no-default-features --features tokio,aws-lc-rs

      - name: cargo check on MSRV (fips)
        run: cargo check --all-targets --no-default-features --features tokio,fips

  # The crate as crates.io gets it (Block 20, D3): only what `include`
  # lists, built without the repository around it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo publish --dry-run
        run: cargo publish --dry-run

  # The documentation as docs.rs builds it (Block 20, D7): nightly, with the
  # docsrs cfg that shows which items need which feature, natively and for
  # the browser target (Block 44, D19).
  docs-rs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: rustdoc as on docs.rs
        run: |
          cargo doc --no-deps --features test-util,cookies,unstable,unstable-webtransport
          cargo doc --no-deps --features test-util,cookies,unstable,unstable-webtransport --target wasm32-unknown-unknown
        env:
          RUSTDOCFLAGS: --cfg docsrs -D warnings
