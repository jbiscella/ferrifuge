name: dependencies

# Supply-chain gate driven by deny.toml: RustSec advisories, licenses,
# bans and sources. Also runs daily, because new advisories are published
# against the same Cargo.lock without any change in this repository.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a new push cancels the branch's run in progress.
# Daily runs have their own group, so a merge never cancels one.
concurrency:
  group: dependencies-${{ github.event_name == 'schedule' && 'daily' || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
