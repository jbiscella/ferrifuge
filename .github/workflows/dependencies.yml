name: dependencies

# Supply-chain gate driven by deny.toml: RustSec advisories, licenses,
# bans and sources. Also runs daily, because new advisories are published
# against the same Cargo.lock without any change in this repository.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a new push cancels the branch's run in progress.
# Daily runs have their own group, so a merge never cancels one.
concurrency:
  group: dependencies-${{ github.event_name == 'schedule' && 'daily' || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

      - name: cargo deny check (browser target)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --target wasm32-unknown-unknown
          command: check
