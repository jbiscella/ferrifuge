name: release

# Publishes a version to crates.io when its tag is pushed (Block 20, D1):
# every check first, then the publish, which cannot be undone (a version
# can only be yanked), then the GitHub release. Trusted publishing: no
# stored token. The owner registers this workflow and the `release`
# environment as the crate's trusted publisher on crates.io.

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

# As dtolnay/rust-toolchain set them (Block 57, D2).
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Tag names the version, changelog has its section
        run: scripts/check-release-tag "$GITHUB_REF_NAME"

      - name: Tagged commit is on main and its CI succeeded
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$GITHUB_SHA is not on main" >&2; exit 1; }
          conclusion="$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main" \
            --jq '.workflow_runs[0].conclusion // "none"')"
          if [ "$conclusion" != success ]; then
            echo "the ci run of main for $GITHUB_SHA has not succeeded ($conclusion): re-run the release once it has" >&2
            exit 1
          fi

      # The latest real run of the real-server chaos for the tagged commit
      # passed (Block 51 D12).
      - name: Real-server chaos passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/validation-run gate chaos-real.yml "$GITHUB_SHA"

      # And the latest real soak run for it (Block 52 D11): a weekly
      # schedule that has not reached the tagged commit needs a dispatch.
      - name: Soak passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/validation-run gate soak.yml "$GITHUB_SHA"

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-semver-checks@0.51.0

      # Against the latest version on crates.io, as the pull-request job
      # checks against the base branch; none before the first publish.
      - name: cargo semver-checks
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            -A "ferrifuge release (github.com/$GITHUB_REPOSITORY)" \
            https://crates.io/api/v1/crates/ferrifuge)"
          case "$status" in
            200) cargo semver-checks --default-features --features test-util,cookies ;;
            404) echo "no version on crates.io yet: nothing to compare with" ;;
            *) echo "crates.io answered $status: cannot check semver" >&2; exit 1 ;;
          esac

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Trusted publishing, and the attestations' signing (Block 69, D3).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # The SBOM first: a failure stops the release before anything
      # irreversible (Block 69, D1).
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-cyclonedx@0.5.9

      - name: Version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: SBOM
        run: scripts/release-sbom "$RUNNER_TEMP/assets"

      # A re-run after the publish packages again instead (Block 69, D2).
      - name: Published already?
        id: published
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            -A "ferrifuge release (github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/ferrifuge/$VERSION")"
          case "$status" in
            404) echo "already=false" >> "$GITHUB_OUTPUT" ;;
            200) echo "already=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io answered $status for $VERSION" >&2; exit 1 ;;
          esac

      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.published.outputs.already == 'false'
        id: auth

      - name: cargo publish
        if: steps.published.outputs.already == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish

      - name: cargo package (a re-run)
        if: steps.published.outputs.already == 'true'
        run: cargo package --no-verify

      # crates.io must serve the file attested (Block 69, D2).
      - name: crates.io serves the packaged file
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/release-digest "$VERSION" "target/package/ferrifuge-$VERSION.crate"
          cp "target/package/ferrifuge-$VERSION.crate" "$RUNNER_TEMP/assets/"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/ferrifuge-${{ steps.version.outputs.version }}.crate

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/assets/ferrifuge-${{ steps.version.outputs.version }}.crate
          sbom-path: ${{ runner.temp }}/assets/ferrifuge-${{ steps.version.outputs.version }}.cdx.json

      # One directory, so that the artifact holds the two files at its top.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/assets/
          if-no-files-found: error
          overwrite: true

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: assets

      # The version's changelog section as the notes, marked as a
      # pre-release for a version with a pre-release part (Block 55, D4);
      # re-running this job never publishes again.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$version] - " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          prerelease=()
          case "$version" in
            *-*) prerelease=(--prerelease) ;;
          esac
          # A published release: nothing to do; a draft left by a stopped
          # run: deleted, the tag kept, and made again (Block 69, D4).
          draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null || echo none)"
          case "$draft" in
            false) echo "the release of $GITHUB_REF_NAME is published"; exit 0 ;;
            true) gh release delete "$GITHUB_REF_NAME" --yes ;;
          esac
          shopt -s nullglob
          assets=(assets/*.cdx.json assets/*.crate)
          [ "${#assets[@]}" -eq 2 ] || { echo "expected the SBOM and the .crate, got: ${assets[*]}" >&2; exit 1; }
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md "${prerelease[@]}" "${assets[@]}"
