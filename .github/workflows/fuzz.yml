name: fuzz

# Longer coverage-guided fuzzing of the decoders (Block 14e); CI runs each
# target for 30 s on every change.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - json::tests::fuzz_decode
          - protobuf::tests::fuzz_decode
          - adapter::http::tests::fuzz_http_stream_decoder
          - adapter::http::tests::fuzz_sse_decoder
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-bolero
        run: cargo install cargo-bolero --locked --version 0.13.5

      - name: Fuzz for 20 minutes
        run: cargo bolero test --toolchain nightly "${{ matrix.target }}" -T 20m

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes-${{ strategy.job-index }}
          path: src/**/__fuzz__/**/crashes
          if-no-files-found: ignore
