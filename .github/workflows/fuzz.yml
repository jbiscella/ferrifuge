name: fuzz

# Longer coverage-guided fuzzing of the decoders (Block 14e), nightly; CI
# runs each target for 30 s on every merge to main.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run per branch; it never runs on pull requests, so a run in progress
# is never cancelled: a new one waits for it.
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - json::tests::fuzz_decode
          - protobuf::tests::fuzz_decode
          - adapter::tokio::http::tests::fuzz_http_stream_decoder
          - adapter::tokio::http::tests::fuzz_sse_decoder
          - adapter::tokio::http::tests::fuzz_protobuf_stream_decoder
          - fossil::tests::fuzz_apply
          - fossil::tests::fuzz_written_delta_round_trip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install cargo-bolero
        run: cargo install cargo-bolero --locked --version 0.13.5

      - name: Fuzz for 10 minutes
        env:
          TARGET: ${{ matrix.target }}
        run: cargo bolero test --toolchain nightly "$TARGET" -T 10m

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes-${{ strategy.job-index }}
          path: src/**/__fuzz__/**/crashes
          if-no-files-found: ignore
